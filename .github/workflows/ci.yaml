name: CI
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

# The goal here is to cancel older workflows when a PR is updated (because it's pointless work)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:  # restrict by default, add more permissions in jobs that need them
  contents: read

jobs:
  unittest:
    name: unit tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Don't go crazy with the Python versions as the test suite is a beast.
        # Just test the minimum version we support.
        python-version: ["3.11"]

    permissions:
      contents: read
      pull-requests: write  # for coverage action to add comments

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv venv
          uv pip install .[tests]

      - name: Test with pytest
        run: |
          source .venv/bin/activate
          python -m pytest --cov=cumulus_etl --cov-report=xml

      - name: Log missing coverage
        run: |
          source .venv/bin/activate
          coverage report -m --skip-covered

      - name: Check coverage report
        if: github.ref != 'refs/heads/main'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: .98
          thresholdNew: 1
          thresholdModified: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install linters
        run: |
          python -m pip install --upgrade uv
          uv venv
          uv pip install .[dev]

      - name: Run ruff
        run: |
          source .venv/bin/activate
          ruff check --output-format=github .

  bdf-validation:
    name: BDF validation
    uses: ARPA-H-BDF/bdfkb-schema/.github/workflows/ci-validate.yaml@main
    with:
      python-version: '3.11'
